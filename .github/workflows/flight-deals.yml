name: flight-deals

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (정각은 GitHub 대기열이 몰려서 피함)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write           # 가격 기록(data/)을 저장소에 저장

concurrency:
  group: flight-deals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 가격 수집 & 특가 알림
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: 기록 저장
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update price history"
          git pull --rebase --autostash || true
          git push
